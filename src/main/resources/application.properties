spring.application.name=diary-food

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/course_work?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — схемой управляет SQL-дамп, Hibernate только маппит сущности
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL-дамп — создаёт схему и загружает начальные данные при каждом старте
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:course_work.sql

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=8080

# Загрузка файлов (фото рецептов)
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
