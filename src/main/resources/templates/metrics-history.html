<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>История замеров — DairyFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container pb-5" style="max-width:800px">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <h5 class="mb-0 fw-semibold">Полная история замеров</h5>
        <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm">← Профиль</a>
    </div>

    <div th:if="${metricsHistory == null or metricsHistory.empty}"
         class="text-muted text-center py-5">
        Замеров пока нет
    </div>

    <div th:if="${metricsHistory != null and !metricsHistory.empty}"
         class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Дата и время</th>
                    <th>Рост, см</th>
                    <th>Масса, кг</th>
                    <th>ИМТ</th>
                    <th>Активность</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${metricsHistory}">
                    <td th:text="${#temporals.format(m.measuredAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${m.height}"></td>
                    <td th:text="${m.weight}"></td>
                    <td th:text="${#numbers.formatDecimal(m.bmi(), 1, 1)}"></td>
                    <td th:text="${m.activityLevel.name() == 'SEDENTARY'         ? 'Минимальный' :
                                   m.activityLevel.name() == 'LIGHTLY_ACTIVE'   ? 'Низкий' :
                                   m.activityLevel.name() == 'MODERATELY_ACTIVE' ? 'Средний' :
                                   m.activityLevel.name() == 'VERY_ACTIVE'      ? 'Высокий' : 'Очень высокий'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small">
            Всего записей: <span th:text="${metricsHistory.size()}"></span>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
