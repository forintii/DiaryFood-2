<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый продукт — DairyFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="max-width:500px">
    <div class="card shadow-sm">
        <div class="card-header bg-white"><h6 class="mb-0">Добавить свой продукт</h6></div>
        <div class="card-body">
            <form th:action="@{/products/new}" method="post" th:object="${product}">
                <div class="mb-3">
                    <label class="form-label">Название</label>
                    <input type="text" th:field="*{name}" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="Гречка варёная">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label">Калории (на 100 г)</label>
                        <input type="number" th:field="*{caloriesPer100g}" class="form-control" step="0.1" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Белки (г)</label>
                        <input type="number" th:field="*{proteinsPer100g}" class="form-control" step="0.1" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Жиры (г)</label>
                        <input type="number" th:field="*{fatsPer100g}" class="form-control" step="0.1" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Углеводы (г)</label>
                        <input type="number" th:field="*{carbsPer100g}" class="form-control" step="0.1" min="0">
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Сохранить</button>
                    <a th:href="@{/diary}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
