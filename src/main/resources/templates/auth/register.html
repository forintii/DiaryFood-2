<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — DairyFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
    <div class="card shadow" style="width:420px">
        <div class="card-body p-4">
            <h4 class="text-center mb-1">DairyFood</h4>
            <p class="text-center text-muted mb-4">Создать аккаунт</p>

            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

            <form th:action="@{/auth/register}" method="post" th:object="${request}">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="your@email.ru">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль <small class="text-muted">(минимум 6 символов)</small></label>
                    <input type="password" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
            </form>

            <hr>
            <p class="text-center mb-0 small">
                Уже есть аккаунт? <a th:href="@{/auth/login}">Войти</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
