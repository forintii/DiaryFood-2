<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход — DairyFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
    <div class="card shadow" style="width:420px">
        <div class="card-body p-4">
            <h4 class="text-center mb-1">DairyFood</h4>
            <p class="text-center text-muted mb-4">Дневник питания</p>

            <div th:if="${param.error}" class="alert alert-danger py-2">
                Неверный email или пароль
            </div>
            <div th:if="${param.logout}" class="alert alert-info py-2">
                Вы вышли из аккаунта
            </div>
            <div th:if="${param.registered}" class="alert alert-success py-2">
                Регистрация прошла успешно! Войдите в аккаунт.
            </div>

            <form th:action="@{/auth/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="username" class="form-control" placeholder="your@email.ru" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Войти</button>
            </form>

            <hr>
            <p class="text-center mb-0 small">
                Нет аккаунта? <a th:href="@{/auth/register}">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
