<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка — DairyFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width:600px">
    <div class="text-center mb-4">
        <span style="font-size:4rem;">⚠️</span>
        <h3 class="mt-3">Что-то пошло не так</h3>
    </div>

    <div class="alert alert-danger" th:if="${error}">
        <strong>Ошибка:</strong> <span th:text="${error}">Неизвестная ошибка</span>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-4">
        <a href="javascript:history.back()" class="btn btn-outline-secondary">← Назад</a>
        <a href="/diary" class="btn btn-primary">На главную</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
